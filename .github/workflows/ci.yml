name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile benchmarks/*.py scripts/*.py tests/*.py
      - name: FA4 vendor integrity
        run: python3 scripts/verify-fa4-vendor.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Champion launch render
        run: python3 scripts/check_launch_render.py
